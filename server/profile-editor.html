<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Local Autofill Profile</title>
  <style>
    :root { font-family: Arial, sans-serif; color: #1f2937; background: #f1f5f9; }
    body { max-width: 820px; margin: 0 auto; padding: 28px 18px 60px; }
    header { margin-bottom: 22px; }
    h1 { margin-bottom: 6px; }
    header p { color: #64748b; margin: 0; }
    fieldset { margin: 0 0 18px; padding: 18px; border: 1px solid #cbd5e1; border-radius: 10px; background: white; }
    legend { padding: 0 8px; font-weight: 700; color: #0f172a; }
    .grid { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 14px; }
    .field { display: grid; gap: 5px; }
    .field.wide { grid-column: 1 / -1; }
    label { font-size: 13px; font-weight: 700; }
    input, textarea, select { box-sizing: border-box; width: 100%; border: 1px solid #94a3b8; border-radius: 7px; padding: 9px 10px; font: inherit; background: white; }
    textarea { min-height: 110px; resize: vertical; }
    .notice { margin: 16px 0; padding: 12px; border-radius: 8px; background: #e0f2fe; color: #0c4a6e; font-size: 13px; }
    .actions { position: sticky; bottom: 0; display: flex; align-items: center; gap: 12px; padding: 14px; border: 1px solid #cbd5e1; border-radius: 10px; background: rgba(255, 255, 255, 0.96); }
    button { border: 0; border-radius: 7px; padding: 10px 18px; background: #2563eb; color: white; font-weight: 700; cursor: pointer; }
    button:disabled { opacity: 0.55; cursor: wait; }
    #status { font-size: 13px; color: #475569; }
    @media (max-width: 620px) { .grid { grid-template-columns: 1fr; } .field.wide { grid-column: auto; } }
  </style>
</head>
<body>
  <header>
    <h1>Local Autofill Profile</h1>
    <p>This page and your profile stay on the local server running on your computer.</p>
  </header>
  <p class="notice">Leave anything blank that you do not want suggested. Do not store passwords, Social Security numbers, government ID numbers, banking details, or security answers here.</p>
  <form id="profile-form"></form>
  <div class="actions">
    <button id="save-profile" type="submit" form="profile-form">Save local profile</button>
    <span id="status" role="status">Loading profile…</span>
  </div>
  <script>
    const form = document.getElementById("profile-form");
    const saveButton = document.getElementById("save-profile");
    const status = document.getElementById("status");
    let fields = [];

    function makeControl(field, value) {
      let control;
      if (field.type === "textarea") {
        control = document.createElement("textarea");
      } else if (field.type === "choice") {
        control = document.createElement("select");
        for (const optionValue of field.options) {
          const option = document.createElement("option");
          option.value = optionValue;
          option.textContent = optionValue || "Choose an option";
          control.append(option);
        }
      } else {
        control = document.createElement("input");
        control.type = field.type;
      }
      control.id = field.key;
      control.name = field.key;
      control.value = value ?? "";
      return control;
    }

    function render(schema, profile) {
      const sections = new Map();
      for (const field of schema) {
        if (!sections.has(field.section)) sections.set(field.section, []);
        sections.get(field.section).push(field);
      }

      for (const [sectionName, sectionFields] of sections) {
        const fieldset = document.createElement("fieldset");
        const legend = document.createElement("legend");
        const grid = document.createElement("div");
        legend.textContent = sectionName;
        grid.className = "grid";
        fieldset.append(legend, grid);

        for (const field of sectionFields) {
          const wrapper = document.createElement("div");
          const label = document.createElement("label");
          wrapper.className = field.type === "textarea" ? "field wide" : "field";
          label.htmlFor = field.key;
          label.textContent = field.label;
          wrapper.append(label, makeControl(field, profile[field.key]));
          grid.append(wrapper);
        }
        form.append(fieldset);
      }
    }

    async function load() {
      try {
        const [schemaResponse, profileResponse] = await Promise.all([
          fetch("/profile-schema", { cache: "no-store" }),
          fetch("/profile", { cache: "no-store" })
        ]);
        if (!schemaResponse.ok || !profileResponse.ok) throw new Error("Could not load profile");
        fields = await schemaResponse.json();
        render(fields, await profileResponse.json());
        status.textContent = "Ready. Changes are not saved yet.";
      } catch (error) {
        status.textContent = "Could not load the local profile.";
        saveButton.disabled = true;
        console.error(error);
      }
    }

    form.addEventListener("submit", async (event) => {
      event.preventDefault();
      saveButton.disabled = true;
      status.textContent = "Saving…";
      const profile = Object.fromEntries(
        fields.map((field) => [field.key, form.elements[field.key].value.trim()])
      );

      try {
        const response = await fetch("/profile", {
          method: "PUT",
          headers: {
            "Content-Type": "application/json",
            "X-Local-Autofill": "profile-editor"
          },
          body: JSON.stringify(profile)
        });
        if (!response.ok) throw new Error(`Server returned HTTP ${response.status}`);
        status.textContent = "Saved locally.";
      } catch (error) {
        status.textContent = "Could not save. Check the server and try again.";
        console.error(error);
      } finally {
        saveButton.disabled = false;
      }
    });

    load();
  </script>
</body>
</html>
